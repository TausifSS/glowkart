<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlowKart — Admin Panel Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo_badge.png">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

  <!-- Admin Sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-sidebar-header">
      <img src="assets/logo.png" alt="GlowKart Admin">
    </div>

    <nav class="admin-menu">
      <button class="admin-menu-item active" onclick="switchAdminTab('dashboard')">
        📊 <span>Dashboard</span>
      </button>
      <button class="admin-menu-item" onclick="switchAdminTab('products')">
        💄 <span>Products</span>
      </button>
      <button class="admin-menu-item" onclick="switchAdminTab('orders')">
        📦 <span>Orders</span>
      </button>
      <button class="admin-menu-item" onclick="switchAdminTab('offers')">
        🎁 <span>Offers</span>
      </button>
      <a href="index.html" class="admin-menu-item" style="margin-top: auto; color: var(--gk-pink-primary);">
        🛍️ <span>Back to Store Front</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content Area -->
  <main class="admin-main">
    <header class="admin-header">
      <div class="admin-title" id="admin-page-title">Dashboard Overview</div>
      <div style="font-size: 13px; font-weight: 700; color: var(--gk-dark-muted);">Shikrapur Store Admin 👑</div>
    </header>

    <div class="admin-content" id="admin-tab-content">
      <!-- Dynamic Admin Views -->
    </div>
  </main>

  <!-- Add / Edit Product Modal -->
  <div class="modal-backdrop" id="product-modal-backdrop">
    <div class="admin-modal">
      <div class="modal-header">
        <h3 style="font-size: 16px; font-weight: 800;" id="product-modal-title">Add New Product</h3>
        <button style="border:none; background:none; font-size:18px; cursor:pointer;" onclick="closeProductModal()">✕</button>
      </div>
      <div class="modal-body">
        <form id="product-form">
          <input type="hidden" id="p-id">
          
          <div class="form-group">
            <label>Product Name *</label>
            <input type="text" id="p-name" class="form-control" required placeholder="e.g. Color Sensational Lipstick">
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="form-group">
              <label>Brand *</label>
              <input type="text" id="p-brand" class="form-control" required placeholder="e.g. Maybelline">
            </div>
            <div class="form-group">
              <label>Category *</label>
              <select id="p-category" class="form-control" required>
                <option value="makeup">Makeup</option>
                <option value="skincare">Skincare</option>
                <option value="haircare">Haircare</option>
                <option value="fragrances">Fragrances</option>
                <option value="accessories">Beauty Accessories</option>
              </select>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
            <div class="form-group">
              <label>Selling Price (₹) *</label>
              <input type="number" id="p-price" class="form-control" required placeholder="299">
            </div>
            <div class="form-group">
              <label>MRP (₹)</label>
              <input type="number" id="p-mrp" class="form-control" placeholder="399">
            </div>
            <div class="form-group">
              <label>Stock Qty *</label>
              <input type="number" id="p-stock" class="form-control" required placeholder="100">
            </div>
          </div>

          <div class="form-group">
            <label>Image URL *</label>
            <input type="url" id="p-image" class="form-control" required placeholder="https://images.unsplash.com/...">
          </div>

          <div class="form-group">
            <label>Description</label>
            <textarea id="p-desc" class="form-control" rows="3" placeholder="Product details..."></textarea>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
            <button type="button" class="btn btn-outline" style="width: auto;" onclick="closeProductModal()">Cancel</button>
            <button type="submit" class="btn btn-primary" style="width: auto;">Save Product</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
