<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="badgePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="100%" stop-color="#FF4DA6" />
    </linearGradient>
  </defs>

  <!-- Background White Circle -->
  <circle cx="200" cy="200" r="192" fill="#FFFFFF"/>
  
  <!-- Outer Pink Ring Accent -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#badgePink)" stroke-width="4"/>

  <!-- Logo Text Section -->
  <g transform="translate(15, 60)">
    <!-- Sparkles -->
    <path d="M150 25 L152 30 L157 32 L152 34 L150 39 L148 34 L143 32 L148 30 Z" fill="#FF4DA6"/>
    <path d="M165 15 L166 18 L170 19 L166 20 L165 23 L164 20 L160 19 L164 18 Z" fill="#FF69B4"/>
    
    <!-- GlowKart Title Text -->
    <text x="180" y="85" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="#FF4DA6" text-anchor="middle" letter-spacing="-1">Glow<tspan fill="#1A1A1A">Kart</tspan></text>
    
    <!-- Shopping Bag -->
    <g transform="translate(285, 30) scale(0.6)">
      <path d="M 35 15 C 35 4, 55 4, 55 15" fill="none" stroke="#FF2E93" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 24 16 L 66 16 C 69 16 71 18 72 21 L 78 68 C 79 72 76 76 72 76 L 18 76 C 14 76 11 72 12 68 L 18 21 C 19 18 21 16 24 16 Z" fill="url(#badgePink)" />
      <path d="M 45 42 C 45 37, 37 34, 34 40 C 31 34, 23 37, 23 42 C 23 50, 34 56, 34 56 C 34 56, 45 50, 45 42 Z" fill="#FFFFFF" transform="translate(11, -3)" />
    </g>

    <!-- Tagline -->
    <text x="185" y="112" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" fill="#1A1A1A" text-anchor="middle" letter-spacing="1">Beauty Delivered to Shikrapur</text>
  </g>

  <!-- Bottom Pink Brush Splatter Arc -->
  <path d="M 60 300 Q 200 330 340 300 C 310 325 240 335 160 325 Z" fill="#FF85C0" opacity="0.6"/>

  <!-- Cosmetics Row at Bottom -->
  <g transform="translate(70, 220)">
    <!-- Makeup Brush -->
    <g transform="translate(20, 10) rotate(-15)">
      <rect x="12" y="40" width="8" height="55" rx="3" fill="#1A1A1A"/>
      <rect x="10" y="32" width="12" height="12" rx="2" fill="#D1D5DB"/>
      <path d="M 8 32 C 4 12, 28 12, 24 32 Z" fill="#FF4DA6"/>
    </g>

    <!-- Lipstick -->
    <g transform="translate(65, 12)">
      <rect x="8" y="45" width="20" height="40" rx="3" fill="#1A1A1A"/>
      <rect x="11" y="28" width="14" height="20" fill="#E5E7EB"/>
      <path d="M 12 30 L 24 20 C 26 30, 20 30, 12 30 Z" fill="#FF2E93"/>
    </g>

    <!-- Nail Polish -->
    <g transform="translate(115, 25)">
      <rect x="10" y="5" width="12" height="22" rx="2" fill="#1A1A1A"/>
      <path d="M 4 25 L 28 25 C 31 25, 32 27, 32 30 L 32 55 C 32 58, 30 60, 26 60 L 6 60 C 2 60, 0 58, 0 55 L 0 30 C 0 27, 1 25, 4 25 Z" fill="#FF4DA6"/>
      <rect x="6" y="32" width="20" height="20" rx="2" fill="#FFFFFF" opacity="0.3"/>
    </g>

    <!-- Blush Compact / Mirror -->
    <g transform="translate(160, 20)">
      <circle cx="28" cy="40" r="24" fill="#1A1A1A"/>
      <circle cx="28" cy="40" r="18" fill="#FF4DA6"/>
      <ellipse cx="22" cy="34" rx="8" ry="4" fill="#FFFFFF" opacity="0.4"/>
    </g>

    <!-- Mascara Tube -->
    <g transform="translate(225, 10) rotate(12)">
      <rect x="6" y="20" width="12" height="65" rx="3" fill="#1A1A1A"/>
      <rect x="8" y="22" width="8" height="25" fill="#FF4DA6" opacity="0.8"/>
    </g>
  </g>
</svg>
